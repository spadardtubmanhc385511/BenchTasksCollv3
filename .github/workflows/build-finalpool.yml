name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Copy implemented tasks
        run: python scripts/build_finalpool.py
      - name: Commit finalpool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/finalpool
          if git diff --cached --quiet; then
            echo "No finalpool changes"
          else
            git commit -m "Add all implemented tasks to finalpool"
            git push origin HEAD:finalpool
          fi
